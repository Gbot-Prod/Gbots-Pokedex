<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">


        <title>Pokédex</title>
        <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="pokemon.css">
        <script>
            // Apply a saved theme before first paint to avoid a flash of the wrong colours.
            try {
                const savedTheme = localStorage.getItem("pokedex:theme");
                if (savedTheme) {
                    document.documentElement.dataset.theme = savedTheme;
                }
            } catch (error) {}
        </script>
    </head>
    <body>
        <button type="button" id="themeToggleBtn" aria-label="Toggle dark mode">🌙</button>
        <main class="page">
            <form id="searchForm" role="search">
                <input type="text" id="pokemonLookupInpt" placeholder="Name or number, e.g. 25" aria-label="Pokémon name or Pokédex number" autocomplete="off" list="pokemonNameList">
                <datalist id="pokemonNameList"></datalist>
                <button type="submit" class="btn" id="getPokemonBtn">Get Pokémon</button>
                <button type="button" class="btn" id="randomPokemonBtn">Random</button>
                <button type="button" class="btn" id="clearDataBtn">Clear</button>
            </form>

            <div class="hidden" id="loadingIndicator" role="status">
                <span class="spinner" aria-hidden="true"></span>
                <span>Loading…</span>
            </div>

            <div class="hidden" id="errorMessage" role="alert"></div>
            <p id="resultAnnouncer" class="visuallyHidden" aria-live="polite"></p>

            <div class="hidden" id="pokemonCardContainer">
                <div class="header" id="pokemonHeader">
                    <button type="button" class="navBtn" id="prevPokemonBtn" aria-label="Previous Pokémon">‹</button>
                    <h1 id="headerTitle"> Pokémon Info </h1>
                    <button type="button" class="navBtn" id="nextPokemonBtn" aria-label="Next Pokémon">›</button>
                </div>
                <div id="pokemonDetailsContainer">
                    <div id="pokemonSpriteContainer">
                        <img class="order3" src="" id="pokemonSprite" alt="" style="display:none;" >
                        <button type="button" id="shinyToggleBtn" aria-pressed="false" title="Show shiny sprite">✨ Shiny</button>
                    </div>
                    <div id="pokemonNameRow">
                        <h1 id="pokemonName">
                        </h1>
                        <button type="button" id="compareCurrentBtn" title="Compare with another Pokémon" aria-label="Compare with another Pokémon">⚖️</button>
                        <button type="button" id="favoriteBtn" aria-pressed="false" aria-label="Favorite" title="Add to favorites">☆</button>
                    </div>
                    <h3 id="pokemonNumber">
                    </h3>
                    <p id="pokemonGenus"></p>
                    <div id="pokemonTypeContainer">
                        <img class="typeIcon" src="" id="pokemonType1" alt="" style="display:none;" width="60" height="60">
                        <img class="typeIcon" src="" id="pokemonType2" alt="" style="display:none;" width="60" height="60">
                    </div> 
                    <p id="pokemonFlavorText"></p>
                    <dl id="pokemonMeasurements">
                        <div>
                            <dt>Height</dt>
                            <dd id="pokemonHeight"></dd>
                        </div>
                        <div>
                            <dt>Weight</dt>
                            <dd id="pokemonWeight"></dd>
                        </div>
                    </dl>
                    <p id="pokemonAbility">
                    </p>
                    <section id="pokemonStats" aria-labelledby="statsHeading">
                        <h2 id="statsHeading">Base stats</h2>
                        <ul id="statsList"></ul>
                    </section>
                    <section id="pokemonMatchups" aria-labelledby="matchupsHeading" hidden>
                        <h2 id="matchupsHeading">Type matchups</h2>
                        <dl id="matchupsList"></dl>
                    </section>
                    <section id="pokemonEvolution" aria-labelledby="evolutionHeading" hidden>
                        <h2 id="evolutionHeading">Evolution</h2>
                        <ol id="evolutionList"></ol>
                    </section>
                </div>
            </div>

            <section id="compareSection" class="tileSection" aria-labelledby="compareHeading">
                <h2 id="compareHeading">Compare Pokémon</h2>
                <form id="compareForm">
                    <input type="text" id="compareLeftInput" class="compareInput" placeholder="First Pokémon" aria-label="First Pokémon" list="pokemonNameList" autocomplete="off">
                    <span aria-hidden="true">vs</span>
                    <input type="text" id="compareRightInput" class="compareInput" placeholder="Second Pokémon" aria-label="Second Pokémon" list="pokemonNameList" autocomplete="off">
                    <button type="submit" class="btn" id="compareBtn">Compare</button>
                </form>
                <p id="compareStatus" role="status"></p>
                <div id="compareResult" hidden>
                    <table id="compareTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section id="recentSection" class="tileSection" aria-labelledby="recentHeading" hidden>
                <div class="sectionHeader">
                    <h2 id="recentHeading">Recently viewed</h2>
                    <button type="button" class="linkBtn" id="clearRecentBtn">Clear history</button>
                </div>
                <ul id="recentList" class="tileGrid compact"></ul>
            </section>

            <section id="favoritesSection" class="tileSection" aria-labelledby="favoritesHeading" hidden>
                <h2 id="favoritesHeading">Favorites</h2>
                <ul id="favoritesList" class="tileGrid"></ul>
            </section>

            <section id="browseSection" class="tileSection" aria-labelledby="browseHeading">
                <h2 id="browseHeading">Browse the Pokédex</h2>
                <div id="browseFilters">
                    <label for="typeFilter">Type</label>
                    <select id="typeFilter">
                        <option value="">All types</option>
                    </select>
                    <label for="generationFilter">Generation</label>
                    <select id="generationFilter">
                        <option value="">All generations</option>
                    </select>
                </div>
                <p id="browseStatus" role="status"></p>
                <ul id="browseGrid" class="tileGrid"></ul>
                <nav id="browsePagination" aria-label="Browse pages">
                    <button type="button" class="btn" id="browsePrevBtn">‹ Prev</button>
                    <span id="browsePageLabel"></span>
                    <button type="button" class="btn" id="browseNextBtn">Next ›</button>
                </nav>
            </section>
        </main>
        <script src="pokemon.js"></script>
    </body>
</html>
