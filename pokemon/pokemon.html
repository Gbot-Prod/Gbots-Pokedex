<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">


        <title> Pokemon Lookup </title>
        <link rel="stylesheet" href="pokemon.css">
    </head>
    <body>
        <div class="header">
            <form id="searchForm" role="search">
                <input type="text" id="pokemonLookupInpt" placeholder="Name or number, e.g. pikachu or 25" aria-label="Pokémon name or Pokédex number" autocomplete="off">
                <button type="submit" class="btn" id="getPokemonBtn">Get Pokémon</button>
                <button type="button" class="btn" id="randomPokemonBtn">Random</button>
                <button type="button" class="btn" id="clearDataBtn">Clear</button>
            </form>

            <div class="hidden" id="loadingIndicator" role="status">
                <span class="spinner" aria-hidden="true"></span>
                <span>Loading…</span>
            </div>

            <p class="hidden" id="errorMessage" role="alert"></p>

            <div class="hidden" id="pokemonCardContainer">
                <div class="header" id="pokemonHeader">
                    <button type="button" class="navBtn" id="prevPokemonBtn" aria-label="Previous Pokémon">‹</button>
                    <h1 id="headerTitle"> Pokémon Info </h1>
                    <button type="button" class="navBtn" id="nextPokemonBtn" aria-label="Next Pokémon">›</button>
                </div>
                <div id="pokemonDetailsContainer">
                    <div id="pokemonSpriteContainer">
                        <img class="order3" src="" id="pokemonSprite" alt="Pokémon Image" style="display:none;" >
                        <button type="button" id="shinyToggleBtn" aria-pressed="false" title="Show shiny sprite">✨ Shiny</button>
                    </div>
                    <h1 id="pokemonName"> 
                    </h1>
                    <h3 id="pokemonNumber">
                    </h3>
                    <p id="pokemonGenus"></p>
                    <div id="pokemonTypeContainer">
                        <img class="typeIcon" src="" id="pokemonType1" alt="Pokémon Type" style="display:none;" width="60" height="60">
                        <img class="typeIcon" src="" id="pokemonType2" alt="Pokémon Type" style="display:none;" width="60" height="60">
                    </div> 
                    <p id="pokemonFlavorText"></p>
                    <dl id="pokemonMeasurements">
                        <div>
                            <dt>Height</dt>
                            <dd id="pokemonHeight"></dd>
                        </div>
                        <div>
                            <dt>Weight</dt>
                            <dd id="pokemonWeight"></dd>
                        </div>
                    </dl>
                    <p id="pokemonAbility">
                    </p>
                    <section id="pokemonStats" aria-labelledby="statsHeading">
                        <h2 id="statsHeading">Base stats</h2>
                        <ul id="statsList"></ul>
                    </section>
                </div>
            </div>
        </div>
        <script src="pokemon.js"></script>
    </body>
</html>
